<main class="main">
  <section class="appointment">
    <div class="container">
      <div class="appointment__inner">
        <h1 class="title appointment__title">BOOK AN APPOINTMENT</h1>
        <div class="appointment__box">
          <form class="appointment__form">
            <p class="appointment__form-title">CONTACT INFORMATHION</p>
            <p class="appointment__form-text">Fill in your contact details</p>
            <input class="appointment__input" type="text" name="first_name" placeholder="First name" required/>
            <input class="appointment__input" type="text" name="last_name" placeholder="Last name" required />
            <input class="appointment__input" type="tel" name="mobile" placeholder="Mobile" required />
            <input class="appointment__input" type="email" name="email" placeholder="Email" required />
            <button class="appointment__btn" type="submit" >SEND</button>
          </form>
          <picture>
            <source srcset="images/appointment.avif" type="image/avif" />
            <source srcset="images/appointment.webp" type="image/webp" />
            <img class="appointment__img" src="images/appointment.jpg" width="540" height="689" alt="Alt text" />
          </picture>
        </div>
      </div>
    </div>
  </section>
</main>
